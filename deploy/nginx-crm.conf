# 安知策 CRM —— crm.anzhice.site 反向代理到 127.0.0.1:3001
#
# 部署位置：/etc/nginx/sites-available/crm
# 启用方式：ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm
#
# 说明：本文件只含 HTTP(80) 块。SSL 块由 certbot --nginx 自动追加，
# 不手写证书路径 —— 手写容易和 certbot 的自动续期产生冲突。

server {
    listen 80;
    listen [::]:80;
    server_name crm.anzhice.site;

    access_log /var/log/nginx/crm_access.log;
    error_log  /var/log/nginx/crm_error.log;

    # 上传体积：标注时要粘贴长对话，默认 1M 偏小
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 限流按 IP 计数，这个头是 clientIp() 的唯一来源，不能省
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
